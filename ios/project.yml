# XcodeGen spec — the .xcodeproj is generated from this file, not
# hand-edited or committed (see ios/README.md). Run `xcodegen generate`
# after editing this file or adding/removing source files.
name: WakeMate
options:
  bundleIdPrefix: com.wakemate
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.0.0
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.0.0

targets:
  WakeMate:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - WakeMate
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: WakeMate/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        SENTRY_DSN: $(SENTRY_DSN)
        TELEMETRYDECK_APP_ID: $(TELEMETRYDECK_APP_ID)
        NSAlarmKitUsageDescription: "WakeMate uses AlarmKit to ring your alarms reliably, even in silent mode or Focus."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakemate.alarmcall
        # Without this, xcodegen leaves the app icon unset and App Store
        # Connect rejects the upload ("Missing required icon file" /
        # "CFBundleIconName is missing"). Points at
        # WakeMate/Assets.xcassets/AppIcon.appiconset — a single 1024px
        # source image, from which Xcode derives every other size.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Lets `agvtool` (run from ios/fastlane/Fastfile's `beta` lane)
        # stamp CURRENT_PROJECT_VERSION with GitHub Actions' run number on
        # every TestFlight release build — see ticket 02.
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for MVP
      configs:
        # Set explicitly rather than inherited: Xcode's *project template*
        # puts dwarf-with-dsym in Release, but the build system's default
        # for an unset DEBUG_INFORMATION_FORMAT is plain dwarf — and this
        # project is generated by xcodegen, so it never gets the template.
        # Without this, an archive produces no .dSYM bundles at all and the
        # Sentry upload in ios/fastlane/Fastfile has nothing to send.
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry
      - package: TelemetryDeck
        product: TelemetryDeck
    scheme:
      testTargets:
        - WakeMateTests
      gatherCoverageData: true

  WakeMateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - WakeMateTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: WakeMate
      - package: Supabase
        product: Supabase
