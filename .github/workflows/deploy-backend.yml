name: Deploy backend

# Ticket 21: migrations + Edge Functions deploy on merge to main, gated by
# one manual GitHub Environments approval (configured on the `production`
# environment in repo settings, not in this file).

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy Supabase backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Syncs supabase/config.toml's project settings (notably
      # auth.email.enable_confirmations = false) to the hosted project, so
      # sign-up behaves the same in production as it does under
      # `supabase start` — without this, the hosted project keeps
      # Supabase's own default of requiring email confirmation, and the
      # app's sign-up flow (which expects an immediate session) would
      # silently stall on SignUpView instead of reaching the home stub.
      - name: Push project config
        run: supabase config push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Runtime secrets the Edge Functions read at execution time (ticket
      # 18's push notifications, ticket 12's crash reporting) — distinct
      # from the CI-time secrets above. Values are empty until the wizard
      # walks through creating the Apple Push key and Sentry project; an
      # empty `supabase secrets set` is harmless, it just leaves those
      # functions unable to do their job until filled in.
      #
      # APNS_AUTH_KEY_BASE64 is the .p8 key file, base64-encoded, because
      # Supabase secrets (and GitHub secrets passed through a single shell
      # env var) don't tolerate the key's raw multi-line PEM content
      # cleanly. Whatever reads it (ticket 18's Edge Function) must
      # base64-decode before use.
      - name: Set Edge Function runtime secrets
        run: |
          supabase secrets set \
            APNS_AUTH_KEY_BASE64="$APNS_AUTH_KEY_BASE64" \
            APNS_KEY_ID="$APNS_KEY_ID" \
            APNS_TEAM_ID="$APNS_TEAM_ID" \
            SENTRY_DSN="$SENTRY_DSN_EDGE"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APNS_AUTH_KEY_BASE64: ${{ secrets.APNS_AUTH_KEY_BASE64 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          SENTRY_DSN_EDGE: ${{ secrets.SENTRY_DSN_EDGE }}
